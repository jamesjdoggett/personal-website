{% extends "base.html" %}

{% block content %}
<h1>Home</h1>
<p>Some of my courses:</p>

<ul>
    {% for item in items %}
        <li>
            {{ item.name }} -
            {% if item.completed %}
                Completed
            {% else %}
                In progress
            {% endif %}
        </li>
    {% endfor %}
</ul>
{% endblock content %}
